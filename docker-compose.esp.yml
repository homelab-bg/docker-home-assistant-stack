---
# ESP overlay - optional ESPHome and Everything Presence Configurator. For
# Traefik routing, also add docker-compose.esp.traefik.yml.
services:
  home-assistant:
    depends_on:
      - esphome

  ## ESPHome
  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:${ESPHOME_VER:-latest}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Australia/Brisbane}
    privileged: true
    network_mode: host
    volumes:
      - ./esphome/config:/config
      - ./esphome/build:/build
      - ./esphome/cache:/cache
      - /etc/localtime:/etc/localtime:ro

  ## Everything Presence Configurator
  everything-presence-configurator:
    image: everythingsmarthome/everything-presence-mmwave-configurator:${EPC_VER:-latest}
    container_name: ep-configurator
    restart: unless-stopped
    ports:
      - "42069:42069"
      # Firmware updates - ESP devices fetch from this port directly
      - "38080:38080"
    volumes:
      - ./epp-configurator:/config
    # HA uses host networking, so reach it via the host directly - no
    # dependency on DNS resolving HA_HOST, or on Traefik.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - HA_BASE_URL=${HA_BASE_URL:-http://host.docker.internal:8123}
      # Read from secrets/ha_long_lived_token (gitignored) rather than a plain
      # env var, which is visible via `docker inspect`.
      - HA_LONG_LIVED_TOKEN_FILE=/run/secrets/ha_long_lived_token
    secrets:
      - ha_long_lived_token

secrets:
  ha_long_lived_token:
    file: ./secrets/ha_long_lived_token
