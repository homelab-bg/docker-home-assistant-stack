---
# Traefik overlay for Home Assistant (ESP routing lives in
# docker-compose.esp.traefik.yml). HA uses host networking, so it gets labels
# only (no networks:) - Traefik reaches it via host.docker.internal, which
# needs `extra_hosts: host.docker.internal:host-gateway` on the Traefik
# container (set in docker-traefik-portainer). HA must also trust Traefik as a
# reverse proxy (HTTP settings in the UI on HA 2026.8+) - see README.
x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-common-labels: &default-labels
  logging: "promtail"
  logging_jobname: "containerlogs"
  stackname: ${MONITORING_STACK}

services:
  home-assistant:
    labels:
      <<: *default-labels
      traefik.enable: true
      traefik.http.routers.home-assistant.rule: Host(`${HA_HOST:?set HA_HOST to the Home Assistant hostname}`)
      traefik.http.routers.home-assistant.tls: true
      traefik.http.routers.home-assistant.tls.certresolver: letsencrypt
      traefik.http.services.home-assistant.loadbalancer.server.port: "8123"
    logging: *default-logging
