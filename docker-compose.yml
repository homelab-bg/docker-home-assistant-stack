---
# Home Assistant stack - base layer. Home Assistant and Matter Server use
# host networking (mDNS/SSDP discovery, Matter, Bluetooth), so they can't
# join a Docker network - docker-compose.traefik.yml routes to HA via the
# host instead. ESP, MQTT and cloudflared are optional overlays.
services:
  ## Home Assistant
  home-assistant:
    container_name: home-assistant
    image: ghcr.io/home-assistant/home-assistant:${HA_VER:-2026.9.2}
    volumes:
      - ./ha/config:/config
      - /etc/localtime:/etc/localtime:ro
      #- /run/dbus:/run/dbus:ro
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Australia/Brisbane}
    privileged: true
    network_mode: host

  ## Matter Server
  matter-server:
    container_name: matter-server
    image: ghcr.io/matter-js/matterjs-server:${MATTER_VER:-stable}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./matter-server/data:/data
    environment:
      - TZ=${TZ:-Australia/Brisbane}
      - STORAGE_PATH=/data
      # Host NIC Matter uses for link-local IPv6/mDNS (e.g. eth0 on a VM; check
      # with `ip -br addr`). Optional - empty lets matter-server choose, but
      # a name that doesn't exist on the host is fatal.
      - PRIMARY_INTERFACE=${MATTER_INTERFACE:-}
